<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header" class="shipping-header">
  <div class="topbar d-none d-md-block">
    <div class="container d-flex justify-content-between py-1">
      <span>
        <i class="bi bi-box-seam me-1"></i>OldBook - Trung tâm đơn vị vận chuyển
      </span>
      <span class="user-func">
        <span data-auth="user">
          <i class="bi bi-person-check me-1"></i><span data-user-name>Tài khoản</span>
        </span>
        <a href="#" class="ms-3" data-auth="user" data-action="logout">
          <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
        </a>
      </span>
    </div>
  </div>

  <div class="mainbar">
    <div class="container d-flex align-items-center justify-content-between gap-3 py-3">
      <a class="brand" th:href="@{/shipping}">
        <i class="bi bi-box-seam"></i> OldBook - Vận chuyển
      </a>
      <span class="badge badge-role-don-vi-van-chuyen px-3 py-2">
        <i class="bi bi-truck me-1"></i>Đơn vị vận chuyển
      </span>
    </div>
  </div>

  <nav class="menu navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <button class="navbar-toggler ms-auto my-1" type="button" data-bs-toggle="collapse"
              data-bs-target="#shippingMenu" aria-controls="shippingMenu" aria-expanded="false"
              aria-label="Mở menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="shippingMenu">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#requestsTab" data-bs-toggle="pill">
              <i class="bi bi-inbox me-1"></i>Tiếp nhận yêu cầu
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#trackingTab" data-bs-toggle="pill">
              <i class="bi bi-truck me-1"></i>Cập nhật vận chuyển
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

</body>
</html>
