<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Trang mô phỏng đối tác vận chuyển (Sandbox).
-->
<header th:fragment="header" class="shipping-header">

  <!-- ========================= -->
  <!-- TOPBAR -->
  <!-- ========================= -->
  <div class="topbar d-none d-md-block">
    <div class="container d-flex justify-content-between py-1">
      <span>
        <i class="bi bi-box-seam me-1"></i>
        OldBook - Mô phỏng đối tác vận chuyển
      </span>
    </div>
  </div>

  <!-- ========================= -->
  <!-- MAINBAR -->
  <!-- ========================= -->
  <div class="mainbardark">
    <div class="container d-flex align-items-center justify-content-between gap-5 py-5">

      <!-- Logo / quay lại trang Sandbox của đối tác -->
      <a
              class="brand text-uppercase"
              style="color: var(--windy-dunes); letter-spacing: .03em;"
              th:href="${maCode != null}
                    ? @{/shipping/{code}(code=${maCode})}
                    : @{/}">

        <i
                class="bi bi-box-seam me-1"
                style="color: var(--spring-leaf);">
        </i>

        OldBook - Đối tác vận chuyển
      </a>

      <!-- Thông tin đối tác đang được mô phỏng -->
      <div class="d-flex align-items-center gap-2">

        <span
                class="badge badge-role-don-vi-van-chuyen px-3 py-2"
                th:if="${tenDonVi != null}">

          <i class="bi bi-truck me-1"></i>
          Đối tác:
          <span th:text="${tenDonVi}">
            Đơn vị vận chuyển
          </span>
        </span>

      </div>

    </div>
  </div>

</header>

</body>
</html>
