<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Thẻ sách cho các trang do máy chủ dựng (kết quả tìm kiếm, sách cùng danh mục).
  Phải khớp từng phần tử với thẻ do js/book-cards.js dựng cho trang chủ, yêu thích và đã xem gần đây:
  sửa một bên thì sửa cả bên kia (book-card-fragment.test.cjs so hai bên).
  columns: lớp cột Bootstrap bọc ngoài thẻ.
*/-->
<article th:fragment="card(book, columns)" th:class="${columns}"
         th:with="bookUrl=@{/books/{id}(id=${book.maSach})},
                  safeCover=${book.hinhAnhUrl != null and (#strings.startsWith(#strings.toLowerCase(book.hinhAnhUrl), 'http://') or #strings.startsWith(#strings.toLowerCase(book.hinhAnhUrl), 'https://') or (#strings.startsWith(book.hinhAnhUrl, '/') and !#strings.startsWith(book.hinhAnhUrl, '//')))},
                  inStock=${book.soLuongTon != null and book.soLuongTon > 0},
                  hasDiscount=${book.giaBia != null and book.giaBanCu != null and book.giaBia > 0 and book.giaBanCu < book.giaBia},
                  discount=${hasDiscount ? #numbers.formatDecimal((1 - book.giaBanCu.doubleValue() / book.giaBia.doubleValue()) * 100, 1, 0) : '0'}">
    <div class="book-card">
        <div class="book-card-top">
            <span class="shop-line"><i class="bi bi-shop me-1" aria-hidden="true"></i><th:block th:text="${#strings.isEmpty(book.tenCuaHang) ? 'Cửa hàng' : book.tenCuaHang}">Cửa hàng</th:block></span>
            <span th:if="${book.doMoiPercent != null}" class="condition-badge" th:title="${book.tinhTrangVatLy}"
                  th:text="|Độ mới ${#numbers.formatDecimal(book.doMoiPercent, 1, 0)}%|">Độ mới 90%</span>
        </div>
        <div class="book-cover-wrap">
            <a th:href="${bookUrl}" class="cover" th:classappend="|c${book.maSach % 6}|">
                <span class="cover-title" th:text="${book.tenSach}">Tên sách</span>
                <img th:if="${safeCover}" class="book-card-image" th:src="${book.hinhAnhUrl}" th:alt="${book.tenSach}"
                     loading="lazy" referrerpolicy="no-referrer">
            </a>
            <span th:if="${!#strings.isEmpty(book.tenDanhMuc)}" class="book-category-tag" th:text="${book.tenDanhMuc}">Danh mục</span>
            <button type="button" class="wishlist-mini" data-toggle-wishlist data-requires-login aria-pressed="false"
                    th:attr="data-ma-sach=${book.maSach},aria-label=|Yêu thích sách ${book.tenSach}|">
                <i class="bi bi-heart" aria-hidden="true"></i>
            </button>
        </div>
        <div class="book-info">
            <h3 class="book-title"><a th:href="${bookUrl}" th:text="${book.tenSach}">Tên sách</a></h3>
            <p class="book-author" th:text="|Tác giả: ${#strings.isEmpty(book.tacGia) ? 'Chưa cập nhật' : book.tacGia}|">Tác giả</p>
            <div class="book-price-row">
                <th:block th:if="${book.giaBanCu != null}">
                    <strong class="price" th:text="|${#numbers.formatDecimal(book.giaBanCu, 1, 'POINT', 0, 'COMMA')} đ|">0 đ</strong>
                    <th:block th:if="${discount != '0'}">
                        <s class="price-old" th:text="|${#numbers.formatDecimal(book.giaBia, 1, 'POINT', 0, 'COMMA')} đ|">0 đ</s>
                        <span class="price-off" th:text="|-${discount}%|">-0%</span>
                    </th:block>
                </th:block>
                <span th:unless="${book.giaBanCu != null}" class="text-muted">Chưa cập nhật giá</span>
            </div>
            <span th:if="${!inStock}" class="book-stock-note">Hết hàng</span>
            <span th:if="${inStock and book.soLuongTon <= 3}" class="book-stock-note" th:text="|Chỉ còn ${book.soLuongTon} cuốn|">Chỉ còn 1 cuốn</span>
            <button th:if="${inStock and book.giaBanCu != null}" type="button" class="btn btn-accent btn-sm w-100"
                    data-add-to-cart data-requires-login data-so-luong="1" th:attr="data-ma-sach=${book.maSach}">
                <i class="bi bi-cart-plus me-1" aria-hidden="true"></i>Thêm vào giỏ
            </button>
            <a th:unless="${inStock and book.giaBanCu != null}" th:href="${bookUrl}" class="btn btn-outline-brown btn-sm w-100">Xem chi tiết</a>
        </div>
    </div>
</article>
</body>
</html>
