<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Cổng quản lý OldBook'">Cổng quản lý OldBook</title>
    <!-- Đặt theme lên thẻ <html> trước khi nội dung được vẽ -->
    <script th:src="@{/js/theme.js}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/manager.css}" rel="stylesheet">
</head>
<body class="manager-shell" data-page-requires-login>
<div class="mg-progress" id="mgProgress" aria-hidden="true"></div>

<div class="mg-app">

    <!-- ========== SIDEBAR ========== -->
    <aside class="mg-sidebar offcanvas-md offcanvas-start" id="mgSidebar" tabindex="-1" aria-label="Menu quản lý">
        <div class="mg-sidebar-inner">
            <div class="mg-brand">
                <a th:href="@{/management}" data-shell-link class="mg-brand-link">
                    <i class="bi bi-book-half" aria-hidden="true"></i>
                    <span class="mg-label">
                        <strong>OldBook</strong>
                        <small>Cổng quản lý</small>
                    </span>
                </a>
                <button type="button" class="btn-close btn-close-white d-md-none" data-bs-dismiss="offcanvas" data-bs-target="#mgSidebar" aria-label="Đóng menu"></button>
            </div>

            <nav class="mg-nav" aria-label="Chức năng">
                <a th:href="@{/management}" data-shell-link data-menu="overview" th:classappend="${active == 'overview'} ? 'active'" title="Tổng quan">
                    <i class="bi bi-grid-1x2" aria-hidden="true"></i><span class="mg-label">Tổng quan</span>
                </a>
                <a th:href="@{/management/stats}" data-shell-link data-menu="stats" th:classappend="${active == 'stats'} ? 'active'" title="Thống kê">
                    <i class="bi bi-bar-chart-line" aria-hidden="true"></i><span class="mg-label">Thống kê</span>
                </a>
                <a th:href="@{/management/payments}" data-shell-link data-menu="payments" th:classappend="${active == 'payments'} ? 'active'" title="Thanh toán &amp; Đối soát">
                    <i class="bi bi-cash-coin" aria-hidden="true"></i><span class="mg-label">Thanh toán &amp; Đối soát</span>
                    <span class="mg-badge d-none" data-badge="payments"></span>
                </a>
                <a th:href="@{/store-moderation}" data-shell-link data-menu="moderation" th:classappend="${active == 'moderation'} ? 'active'" title="Kiểm duyệt">
                    <i class="bi bi-check2-square" aria-hidden="true"></i><span class="mg-label">Kiểm duyệt</span>
                    <span class="mg-badge d-none" data-badge="moderation"></span>
                </a>
                <a th:href="@{/management/shipping-carriers}" data-shell-link data-menu="carriers" th:classappend="${active == 'carriers'} ? 'active'" title="Đơn vị vận chuyển">
                    <i class="bi bi-truck" aria-hidden="true"></i><span class="mg-label">Đơn vị vận chuyển</span>
                </a>
                <a th:href="@{/management/commissions}" data-shell-link data-menu="commissions" th:classappend="${active == 'commissions'} ? 'active'" title="Hoa hồng">
                    <i class="bi bi-percent" aria-hidden="true"></i><span class="mg-label">Hoa hồng</span>
                </a>
            </nav>

            <div class="mg-sidebar-foot">
                <div class="mg-user">
                    <i class="bi bi-person-circle" aria-hidden="true"></i>
                    <span class="mg-label">
                        <strong data-user-name>Quản lý</strong>
                        <small data-user-role></small>
                    </span>
                </div>
                <!-- Chuyển tài khoản: auth.js chỉ hiện những vai trò người dùng đang có -->
                <a href="#" class="d-none" data-switch-to="KHACH_HANG" title="Chuyển sang Khách hàng"><i class="bi bi-bag" aria-hidden="true"></i><span class="mg-label">Chuyển sang Khách hàng</span></a>
                <a href="#" class="d-none" data-switch-to="CHU_CUA_HANG" title="Chuyển sang Chủ cửa hàng"><i class="bi bi-shop" aria-hidden="true"></i><span class="mg-label">Chuyển sang Chủ cửa hàng</span></a>
                <a href="#" class="d-none" data-switch-to="QUAN_TRI_VIEN" title="Chuyển sang Quản trị viên"><i class="bi bi-shield-lock" aria-hidden="true"></i><span class="mg-label">Chuyển sang Quản trị viên</span></a>
                <a href="#" data-action="logout" title="Đăng xuất"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span class="mg-label">Đăng xuất</span></a>
            </div>
        </div>
    </aside>

    <!-- ========== PHẦN CHÍNH ========== -->
    <div class="mg-body">
        <header class="mg-topbar">
            <button type="button" class="mg-icon-btn d-md-none" data-bs-toggle="offcanvas" data-bs-target="#mgSidebar" aria-controls="mgSidebar" aria-label="Mở menu">
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

            <div class="mg-topbar-title">
                <h1 id="mgTitle" th:text="${title}">Tổng quan</h1>
                <span class="mg-updated" id="mgUpdated" aria-live="polite"></span>
            </div>

            <div class="mg-topbar-actions">
                <button type="button" class="mg-icon-btn" id="mgRefresh" aria-label="Làm mới" title="Làm mới">
                    <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                </button>

                <div class="dropdown" data-theme-picker>
                    <button type="button" class="mg-icon-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Đổi giao diện" title="Đổi giao diện">
                        <i class="bi bi-palette" aria-hidden="true"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end theme-menu">
                        <li><button type="button" class="dropdown-item theme-option" role="menuitemradio" aria-checked="true" data-theme-option="default">Sáng<i class="bi bi-check2 theme-check" aria-hidden="true"></i></button></li>
                        <li><button type="button" class="dropdown-item theme-option" role="menuitemradio" aria-checked="false" data-theme-option="dark">Tối<i class="bi bi-check2 theme-check" aria-hidden="true"></i></button></li>
                        <li><button type="button" class="dropdown-item theme-option" role="menuitemradio" aria-checked="false" data-theme-option="magazine">Tạp chí<i class="bi bi-check2 theme-check" aria-hidden="true"></i></button></li>
                    </ul>
                </div>

                <!-- Thông báo: notifications.js điền danh sách và số chưa đọc -->
                <div class="dropdown d-none" data-auth="user" data-notify>
                    <button type="button" class="mg-icon-btn position-relative" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                            aria-expanded="false" aria-label="Thông báo" title="Thông báo" data-notify-bell>
                        <i class="bi bi-bell" aria-hidden="true"></i>
                        <span class="header-badge d-none" data-notify-badge>0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end notify-panel">
                        <div class="notify-head">
                            <span class="notify-title">Thông báo</span>
                            <button type="button" class="notify-read-all" data-notify-read-all disabled>Đánh dấu tất cả đã đọc</button>
                        </div>
                        <div class="notify-list" data-notify-list></div>
                        <button type="button" class="notify-more d-none" data-notify-more>Xem thêm</button>
                    </div>
                </div>

                <a class="btn btn-sm mg-btn-ghost d-none d-sm-inline-flex" th:href="@{/books}">
                    <i class="bi bi-box-arrow-up-right me-1" aria-hidden="true"></i>Xem sàn
                </a>
            </div>
        </header>

        <!-- Nội dung từng trang. shell.js thay phần này khi chuyển mục, không tải lại cả trang. -->
        <main id="managerMain" th:attr="data-title=${title},data-menu=${active}" th:insert="${content}"></main>

        <footer class="mg-footer">OldBook Marketplace · Phân hệ Quản lý &amp; Vận hành</footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/notifications.js}"></script>
<script th:src="@{/js/banks.js}"></script>
<script th:src="@{/js/management/realtime.js}"></script>
<script th:src="@{/js/management/shell.js}"></script>
</body>
</html>
