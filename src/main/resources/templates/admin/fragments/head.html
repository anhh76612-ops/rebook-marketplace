<!--
    Head dùng chung cho mọi trang admin.
    Cách dùng: <head th:replace="~{admin/fragments/head :: head(${pageTitle})}"></head>
    Bảng màu, khoảng cách và cỡ chữ chỉ được khai báo tại đây.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - OldBook'">Quản trị - OldBook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

    <!-- Đặt theme lên thẻ <html> trước khi trang được vẽ; lựa chọn dùng chung với trang chính -->
    <script th:src="@{/js/theme.js}"></script>
    <link th:href="@{/css/admin-theme.css}" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script th:inline="none">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Mọi màu là biến CSS --ad-* (kênh RGB) khai báo trong <style> bên dưới, để đổi theme chỉ cần đổi biến.
                        'nau-nhat': 'rgb(var(--ad-nau-nhat) / <alpha-value>)',
                        'da-trang': 'rgb(var(--ad-da-trang) / <alpha-value>)',
                        'chrome': 'rgb(var(--ad-chrome) / <alpha-value>)',
                        'chrome-raised': 'rgb(var(--ad-chrome-raised) / <alpha-value>)',
                        'chrome-line': 'var(--ad-chrome-line)',
                        'on-chrome': 'rgb(var(--ad-on-chrome) / <alpha-value>)',
                        'on-chrome-muted': 'rgb(var(--ad-on-chrome-muted) / <alpha-value>)',
                        'primary': 'rgb(var(--ad-primary) / <alpha-value>)',
                        'on-primary': 'rgb(var(--ad-on-primary) / <alpha-value>)',
                        'primary-container': 'rgb(var(--ad-primary-container) / <alpha-value>)',
                        'on-primary-container': 'rgb(var(--ad-on-primary-container) / <alpha-value>)',
                        'primary-fixed': 'rgb(var(--ad-primary-fixed) / <alpha-value>)',
                        'primary-fixed-dim': 'rgb(var(--ad-primary-fixed-dim) / <alpha-value>)',
                        'on-primary-fixed': 'rgb(var(--ad-on-primary-fixed) / <alpha-value>)',
                        'on-primary-fixed-variant': 'rgb(var(--ad-on-primary-fixed-variant) / <alpha-value>)',
                        'inverse-primary': 'rgb(var(--ad-inverse-primary) / <alpha-value>)',
                        'secondary': 'rgb(var(--ad-secondary) / <alpha-value>)',
                        'on-secondary': 'rgb(var(--ad-on-secondary) / <alpha-value>)',
                        'secondary-container': 'rgb(var(--ad-secondary-container) / <alpha-value>)',
                        'on-secondary-container': 'rgb(var(--ad-on-secondary-container) / <alpha-value>)',
                        'secondary-fixed': 'rgb(var(--ad-secondary-fixed) / <alpha-value>)',
                        'secondary-fixed-dim': 'rgb(var(--ad-secondary-fixed-dim) / <alpha-value>)',
                        'on-secondary-fixed-variant': 'rgb(var(--ad-on-secondary-fixed-variant) / <alpha-value>)',
                        'tertiary': 'rgb(var(--ad-tertiary) / <alpha-value>)',
                        'on-tertiary': 'rgb(var(--ad-on-tertiary) / <alpha-value>)',
                        'tertiary-container': 'rgb(var(--ad-tertiary-container) / <alpha-value>)',
                        'on-tertiary-container': 'rgb(var(--ad-on-tertiary-container) / <alpha-value>)',
                        'tertiary-fixed': 'rgb(var(--ad-tertiary-fixed) / <alpha-value>)',
                        'tertiary-fixed-dim': 'rgb(var(--ad-tertiary-fixed-dim) / <alpha-value>)',
                        'on-tertiary-fixed': 'rgb(var(--ad-on-tertiary-fixed) / <alpha-value>)',
                        'on-tertiary-fixed-variant': 'rgb(var(--ad-on-tertiary-fixed-variant) / <alpha-value>)',
                        'background': 'rgb(var(--ad-background) / <alpha-value>)',
                        'on-background': 'rgb(var(--ad-on-background) / <alpha-value>)',
                        'surface': 'rgb(var(--ad-surface) / <alpha-value>)',
                        'surface-bright': 'rgb(var(--ad-surface-bright) / <alpha-value>)',
                        'surface-dim': 'rgb(var(--ad-surface-dim) / <alpha-value>)',
                        'surface-tint': 'rgb(var(--ad-surface-tint) / <alpha-value>)',
                        'surface-variant': 'rgb(var(--ad-surface-variant) / <alpha-value>)',
                        'surface-warm': 'rgb(var(--ad-surface-warm) / <alpha-value>)',
                        'surface-white': 'rgb(var(--ad-surface-white) / <alpha-value>)',
                        'surface-cream': 'rgb(var(--ad-surface-cream) / <alpha-value>)',
                        'surface-container-lowest': 'rgb(var(--ad-surface-container-lowest) / <alpha-value>)',
                        'surface-container-low': 'rgb(var(--ad-surface-container-low) / <alpha-value>)',
                        'surface-container': 'rgb(var(--ad-surface-container) / <alpha-value>)',
                        'surface-container-high': 'rgb(var(--ad-surface-container-high) / <alpha-value>)',
                        'surface-container-highest': 'rgb(var(--ad-surface-container-highest) / <alpha-value>)',
                        'inverse-surface': 'rgb(var(--ad-inverse-surface) / <alpha-value>)',
                        'inverse-on-surface': 'rgb(var(--ad-inverse-on-surface) / <alpha-value>)',
                        'canvas-bg': 'rgb(var(--ad-canvas-bg) / <alpha-value>)',
                        'on-surface': 'rgb(var(--ad-on-surface) / <alpha-value>)',
                        'on-surface-variant': 'rgb(var(--ad-on-surface-variant) / <alpha-value>)',
                        'body-text': 'rgb(var(--ad-body-text) / <alpha-value>)',
                        'text-muted': 'rgb(var(--ad-text-muted) / <alpha-value>)',
                        'outline': 'rgb(var(--ad-outline) / <alpha-value>)',
                        'outline-variant': 'rgb(var(--ad-outline-variant) / <alpha-value>)',
                        'line-border': 'rgb(var(--ad-line-border) / <alpha-value>)',
                        'border-subtle': 'rgb(var(--ad-border-subtle) / <alpha-value>)',
                        'focus-glow': 'var(--ad-focus-glow)',
                        'shadow-tint': 'var(--ad-shadow-tint)',
                        'olive-grove': 'rgb(var(--ad-olive-grove) / <alpha-value>)',
                        'sand-dune': 'rgb(var(--ad-sand-dune) / <alpha-value>)',
                        'success-soft': 'rgb(var(--ad-success-soft) / <alpha-value>)',
                        'danger-soft': 'rgb(var(--ad-danger-soft) / <alpha-value>)',
                        'mahogany-danger': 'rgb(var(--ad-mahogany-danger) / <alpha-value>)',
                        'error': 'rgb(var(--ad-error) / <alpha-value>)',
                        'on-error': 'rgb(var(--ad-on-error) / <alpha-value>)',
                        'error-container': 'rgb(var(--ad-error-container) / <alpha-value>)',
                        'on-error-container': 'rgb(var(--ad-on-error-container) / <alpha-value>)'
                    },
                    borderRadius: {
                        DEFAULT: 'var(--ad-radius, 0.25rem)',
                        lg: 'var(--ad-radius-lg, 0.5rem)',
                        xl: 'var(--ad-radius-xl, 0.75rem)',
                        full: '9999px'
                    },
                    spacing: {
                        'space-xs': '0.25rem',
                        'space-sm': '0.5rem',
                        'space-md': '1rem',
                        'space-lg': '1.5rem',
                        'space-xl': '2rem',
                        'space-2xl': '3rem',
                        margin: '2rem',
                        'margin-mobile': '1rem',
                        'gutter-sm': '1rem',
                        gutter: '1.5rem'
                    },
                    fontFamily: {
                        'headline-xl': ['Be Vietnam Pro'],
                        'headline-xl-mobile': ['Be Vietnam Pro'],
                        'headline-lg': ['Be Vietnam Pro'],
                        'headline-md': ['Be Vietnam Pro'],
                        'headline-sm': ['Be Vietnam Pro'],
                        'body-lg': ['Be Vietnam Pro'],
                        'body-md': ['Be Vietnam Pro'],
                        'body-sm': ['Be Vietnam Pro'],
                        'label-lg': ['Be Vietnam Pro'],
                        'label-md': ['Be Vietnam Pro'],
                        'label-sm': ['Be Vietnam Pro'],
                        caption: ['Be Vietnam Pro']
                    },
                    fontSize: {
                        'headline-xl': ['32px', { lineHeight: '40px', fontWeight: '700' }],
                        'headline-xl-mobile': ['26px', { lineHeight: '34px', fontWeight: '700' }],
                        'headline-lg': ['24px', { lineHeight: '32px', fontWeight: '700' }],
                        'headline-md': ['20px', { lineHeight: '28px', fontWeight: '700' }],
                        'headline-sm': ['16px', { lineHeight: '24px', fontWeight: '600' }],
                        'body-lg': ['16px', { lineHeight: '26px', fontWeight: '400' }],
                        'body-md': ['14px', { lineHeight: '22px', fontWeight: '400' }],
                        'body-sm': ['13px', { lineHeight: '20px', fontWeight: '400' }],
                        'label-lg': ['14px', { lineHeight: '20px', fontWeight: '600' }],
                        'label-md': ['12px', { lineHeight: '16px', fontWeight: '600' }],
                        'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.08em', fontWeight: '700' }],
                        caption: ['12px', { lineHeight: '16px', fontWeight: '400' }]
                    }
                }
            }
        };
    </script>

    <style>
        /* Giao diện Mặc định. Tối và Tạp chí đổi lại các biến này trong css/admin-theme.css.
           Chọn cho làm việc lâu: vùng lớn (nền, sidebar) dùng màu ít bão hòa, màu nâu đỏ chỉ ở nút và mục đang chọn;
           chữ phụ đạt tương phản từ 5.4:1 trở lên vì trang quản trị dùng nhiều chữ 11-13px. */
        :root {
            --ad-nau-nhat: 210 180 140;
            --ad-da-trang: 255 245 238;
            --ad-chrome: 62 46 40;
            --ad-chrome-raised: 122 58 44;
            --ad-chrome-line: rgba(246, 238, 234, 0.12);
            --ad-on-chrome: 246 238 234;
            --ad-on-chrome-muted: 217 200 191;
            --ad-primary: 122 51 38;
            --ad-on-primary: 255 255 255;
            --ad-primary-container: 142 68 52;
            --ad-on-primary-container: 240 194 176;
            --ad-primary-fixed: 255 218 208;
            --ad-primary-fixed-dim: 237 183 163;
            --ad-on-primary-fixed: 58 15 7;
            --ad-on-primary-fixed-variant: 110 42 30;
            --ad-inverse-primary: 237 183 163;
            --ad-secondary: 85 101 35;
            --ad-on-secondary: 255 255 255;
            --ad-secondary-container: 216 235 154;
            --ad-on-secondary-container: 91 107 41;
            --ad-secondary-fixed: 216 235 154;
            --ad-secondary-fixed-dim: 188 207 129;
            --ad-on-secondary-fixed-variant: 61 76 12;
            --ad-tertiary: 66 41 7;
            --ad-on-tertiary: 255 255 255;
            --ad-tertiary-container: 91 63 28;
            --ad-on-tertiary-container: 211 171 127;
            --ad-tertiary-fixed: 255 221 184;
            --ad-tertiary-fixed-dim: 232 191 145;
            --ad-on-tertiary-fixed: 43 23 0;
            --ad-on-tertiary-fixed-variant: 93 65 30;
            --ad-background: 244 241 236;
            --ad-on-background: 42 37 34;
            --ad-surface: 255 255 255;
            --ad-surface-bright: 255 255 255;
            --ad-surface-dim: 230 223 215;
            --ad-surface-tint: 138 59 42;
            --ad-surface-variant: 236 230 223;
            --ad-surface-warm: 250 248 245;
            --ad-surface-white: 255 255 255;
            --ad-surface-cream: 241 236 230;
            --ad-surface-container-lowest: 255 255 255;
            --ad-surface-container-low: 250 248 245;
            --ad-surface-container: 244 240 235;
            --ad-surface-container-high: 255 255 255;
            --ad-surface-container-highest: 236 230 223;
            --ad-inverse-surface: 55 48 32;
            --ad-inverse-on-surface: 253 239 216;
            --ad-canvas-bg: 244 241 236;
            --ad-on-surface: 42 37 34;
            --ad-on-surface-variant: 78 69 63;
            --ad-body-text: 42 37 34;
            --ad-text-muted: 106 96 88;
            --ad-outline: 133 122 113;
            --ad-outline-variant: 214 204 194;
            --ad-line-border: 226 218 209;
            --ad-border-subtle: 221 212 202;
            --ad-focus-glow: rgba(122, 51, 38, 0.22);
            --ad-shadow-tint: rgba(53, 46, 31, 0.12);
            --ad-olive-grove: 120 115 80;
            --ad-sand-dune: 204 182 147;
            --ad-success-soft: 220 230 195;
            --ad-danger-soft: 232 207 201;
            --ad-mahogany-danger: 72 25 17;
            --ad-error: 186 26 26;
            --ad-on-error: 255 255 255;
            --ad-error-container: 255 218 214;
            --ad-on-error-container: 147 0 10;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            overscroll-behavior: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #CCB693;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
