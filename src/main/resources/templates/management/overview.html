<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/manager/layout :: page('Tổng quan', 'overview', ~{::#pageContent})}">
<body>
<section id="pageContent">
    <div id="ovDenied" class="mg-card text-center py-5 d-none">
        <i class="bi bi-grid-1x2 fs-1 text-muted" aria-hidden="true"></i>
        <h2 class="mt-3">Bạn không có quyền vào cổng quản lý</h2>
        <p class="text-muted">Chức năng này dành cho tài khoản Quản lý.</p>
        <a th:href="@{/books}" class="btn btn-outline-brown">Về trang sách</a>
    </div>

    <div id="ovContent" class="d-none">
        <div id="ovError" class="mg-error mb-3 d-none" role="alert">
            <span id="ovErrorText"></span>
            <button type="button" id="ovRetry" class="btn btn-sm btn-outline-brown">Thử lại</button>
        </div>

        <div class="mg-kpis" id="ovKpis" aria-live="polite">
            <div class="mg-kpi"><span class="mg-skeleton" style="width:60%"></span><span class="mg-skeleton mt-2" style="height:2rem"></span></div>
            <div class="mg-kpi"><span class="mg-skeleton" style="width:60%"></span><span class="mg-skeleton mt-2" style="height:2rem"></span></div>
            <div class="mg-kpi"><span class="mg-skeleton" style="width:60%"></span><span class="mg-skeleton mt-2" style="height:2rem"></span></div>
            <div class="mg-kpi"><span class="mg-skeleton" style="width:60%"></span><span class="mg-skeleton mt-2" style="height:2rem"></span></div>
            <div class="mg-kpi"><span class="mg-skeleton" style="width:60%"></span><span class="mg-skeleton mt-2" style="height:2rem"></span></div>
        </div>

        <div class="mg-grid-2 mt-3">
            <section class="mg-card" aria-labelledby="ovQueueTitle">
                <h2 id="ovQueueTitle">Việc cần xử lý</h2>
                <ul class="mg-queue" id="ovQueue"></ul>
                <p class="mg-empty d-none" id="ovQueueEmpty">Không có việc nào đang chờ. Mọi hàng đợi đều trống.</p>
            </section>

            <div class="d-flex flex-column gap-3">
                <section class="mg-card" aria-labelledby="ovFlowTitle">
                    <h2 id="ovFlowTitle">Dòng tiền sàn <small class="text-muted fs-6">tháng này</small></h2>
                    <dl class="row mb-0" id="ovFlow"></dl>
                </section>
                <section class="mg-card" aria-labelledby="ovCarrierTitle">
                    <h2 id="ovCarrierTitle">Đối tác vận chuyển</h2>
                    <ul class="mg-queue" id="ovCarriers"></ul>
                    <p class="small text-muted mb-0 d-none" id="ovCarriersEmpty">Chưa có đơn nào kết thúc giao hàng.</p>
                </section>
            </div>
        </div>
    </div>
<script type="text/x-page-script" data-page-script th:src="@{/js/management/overview.js}"></script>
</section>
</body>
</html>
