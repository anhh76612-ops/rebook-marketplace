<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không tìm thấy đơn vị vận chuyển - OldBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/shipping/header :: header}"></header>

<main class="container py-5">
  <div class="panel text-center py-5 mx-auto" style="max-width:560px">
    <i class="bi bi-truck display-4 text-muted"></i>
    <h1 class="h4 fw-bold mt-3">Không mở được trang vận chuyển</h1>
    <p class="text-muted mb-0" th:text="${message}">Liên kết không hợp lệ.</p>
  </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
