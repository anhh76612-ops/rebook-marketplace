<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Đổi mật khẩu - OldBook</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">

    <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
            rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body data-page-requires-login>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

    <div class="auth-card">

        <h1 class="h4 fw-bold text-center mb-1">
            Đổi mật khẩu
        </h1>

        <p class="text-center text-muted mb-4">
            Cập nhật mật khẩu cho tài khoản của bạn.
        </p>


        <form id="changePasswordForm" novalidate>

            <!-- Mật khẩu hiện tại -->
            <div class="mb-3">

                <label
                        for="currentPassword"
                        class="form-label">

                    Mật khẩu hiện tại

                </label>

                <input
                        id="currentPassword"
                        type="password"
                        class="form-control"
                        placeholder="Nhập mật khẩu hiện tại"
                        autocomplete="current-password"
                        required>

            </div>


            <!-- Mật khẩu mới -->
            <div class="mb-3">

                <label
                        for="newPassword"
                        class="form-label">

                    Mật khẩu mới

                </label>

                <input
                        id="newPassword"
                        type="password"
                        class="form-control"
                        placeholder="Ít nhất 6 ký tự"
                        autocomplete="new-password"
                        required>

            </div>


            <!-- Xác nhận -->
            <div class="mb-3">

                <label
                        for="confirmPassword"
                        class="form-label">

                    Xác nhận mật khẩu mới

                </label>

                <input
                        id="confirmPassword"
                        type="password"
                        class="form-control"
                        placeholder="Nhập lại mật khẩu mới"
                        autocomplete="new-password"
                        required>

            </div>


            <!-- Error -->
            <div
                    id="changePasswordError"
                    class="alert alert-danger py-2 d-none"
                    role="alert">
            </div>


            <!-- Success -->
            <div
                    id="changePasswordSuccess"
                    class="alert alert-success py-2 d-none"
                    role="alert">
            </div>


            <button
                    type="submit"
                    id="changePasswordBtn"
                    class="btn btn-accent w-100 btn-lg">

                Đổi mật khẩu

            </button>

        </form>


        <div class="text-center mt-3">

            <a
                    th:href="@{/}"
                    class="text-decoration-none">

                Quay lại trang chủ

            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>


<script th:inline="none">

    (function () {

        'use strict';


        var OB = window.OldBook;
        var Auth = OB.auth;


        var form =
            document.getElementById(
                'changePasswordForm'
            );


        var currentPassword =
            document.getElementById(
                'currentPassword'
            );


        var newPassword =
            document.getElementById(
                'newPassword'
            );


        var confirmPassword =
            document.getElementById(
                'confirmPassword'
            );


        var button =
            document.getElementById(
                'changePasswordBtn'
            );


        var errorBox =
            document.getElementById(
                'changePasswordError'
            );


        var successBox =
            document.getElementById(
                'changePasswordSuccess'
            );


        function showError(message) {

            errorBox.textContent = message;

            errorBox.classList.remove(
                'd-none'
            );

        }


        function hideError() {

            errorBox.textContent = '';

            errorBox.classList.add(
                'd-none'
            );

        }


        function showSuccess(message) {

            successBox.textContent = message;

            successBox.classList.remove(
                'd-none'
            );

        }


        function hideSuccess() {

            successBox.textContent = '';

            successBox.classList.add(
                'd-none'
            );

        }


        form.addEventListener(
            'submit',
            function (event) {

                event.preventDefault();

                hideError();
                hideSuccess();


                var oldPassword =
                    currentPassword.value;


                var password =
                    newPassword.value;


                var confirm =
                    confirmPassword.value;


                /*
                 * Kiểm tra dữ liệu ngay tại trình duyệt.
                 */

                if (!oldPassword.trim()) {

                    showError(
                        'Vui lòng nhập mật khẩu hiện tại.'
                    );

                    currentPassword.focus();

                    return;
                }


                if (password.length < 6) {

                    showError(
                        'Mật khẩu mới phải có ít nhất 6 ký tự.'
                    );

                    newPassword.focus();

                    return;
                }


                if (!confirm) {

                    showError(
                        'Vui lòng xác nhận mật khẩu mới.'
                    );

                    confirmPassword.focus();

                    return;
                }


                if (password !== confirm) {

                    showError(
                        'Xác nhận mật khẩu mới không khớp.'
                    );

                    confirmPassword.focus();

                    return;
                }


                button.disabled = true;

                button.textContent =
                    'Đang xử lý...';


                Auth.changePassword(
                    oldPassword,
                    password,
                    confirm
                )

                    .then(function () {

                        showSuccess(
                            'Đổi mật khẩu thành công.'
                        );


                        /*
                         * Xóa dữ liệu các ô nhập.
                         */

                        currentPassword.value = '';
                        newPassword.value = '';
                        confirmPassword.value = '';


                        /*
                         * Không tự đăng xuất.
                         *
                         * JWT hiện tại vẫn còn hợp lệ
                         * vì backend hiện tại chỉ cập nhật
                         * mật khẩu.
                         */

                    })

                    .catch(function (err) {

                        /*
                         * 401:
                         * JWT hết hạn / không hợp lệ
                         */

                        if (err.status === 401) {

                            Auth.clear();

                            window.location.replace(
                                '/login'
                            );

                            return;
                        }


                        showError(
                            err.message
                        );

                    })

                    .finally(function () {

                        button.disabled = false;

                        button.textContent =
                            'Đổi mật khẩu';

                    });

            }
        );

    })();

</script>

</body>
</html>
