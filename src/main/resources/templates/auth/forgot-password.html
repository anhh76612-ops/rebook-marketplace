<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quên mật khẩu - OldBook</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">

    <link
            href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
            rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">

    <div class="auth-card">

        <h1 class="h4 fw-bold text-center mb-1">
            Quên mật khẩu
        </h1>

        <p class="text-center text-muted mb-4">
            Nhập email để nhận mã OTP đặt lại mật khẩu.
        </p>


        <!-- ========================= -->
        <!-- BƯỚC 1: NHẬP EMAIL -->
        <!-- ========================= -->

        <div id="requestStep">

            <form id="forgotRequestForm">

                <div class="mb-3">

                    <label
                            for="forgotEmail"
                            class="form-label">

                        Email

                    </label>

                    <input
                            id="forgotEmail"
                            type="email"
                            class="form-control"
                            placeholder="Nhập email đã đăng ký"
                            autocomplete="email"
                            required>

                </div>

                <div
                        id="forgotRequestError"
                        class="alert alert-danger py-2 d-none"
                        role="alert">
                </div>

                <button
                        type="submit"
                        id="forgotRequestBtn"
                        class="btn btn-accent w-100 btn-lg">

                    Gửi mã OTP

                </button>

            </form>

        </div>


        <!-- ========================= -->
        <!-- BƯỚC 2: NHẬP OTP + MẬT KHẨU -->
        <!-- ========================= -->

        <div id="resetStep" class="d-none">

            <div
                    id="resetInfo"
                    class="alert alert-info py-2">

                Mã OTP đã được gửi đến email của bạn.
                Mã có hiệu lực trong 5 phút.

            </div>


            <form id="resetPasswordForm">

                <div class="mb-3">

                    <label
                            for="resetEmail"
                            class="form-label">

                        Email

                    </label>

                    <input
                            id="resetEmail"
                            type="email"
                            class="form-control"
                            readonly>

                </div>


                <div class="mb-3">

                    <label
                            for="forgotOtp"
                            class="form-label">

                        Mã OTP

                    </label>

                    <input
                            id="forgotOtp"
                            type="text"
                            class="form-control"
                            placeholder="Nhập 6 chữ số"
                            inputmode="numeric"
                            maxlength="6"
                            autocomplete="one-time-code"
                            required>

                </div>


                <div class="mb-3">

                    <label
                            for="newPassword"
                            class="form-label">

                        Mật khẩu mới

                    </label>

                    <input
                            id="newPassword"
                            type="password"
                            class="form-control"
                            placeholder="Ít nhất 8 ký tự, gồm chữ và số"
                            autocomplete="new-password"
                            required>

                </div>


                <div class="mb-3">

                    <label
                            for="confirmPassword"
                            class="form-label">

                        Xác nhận mật khẩu mới

                    </label>

                    <input
                            id="confirmPassword"
                            type="password"
                            class="form-control"
                            placeholder="Nhập lại mật khẩu mới"
                            autocomplete="new-password"
                            required>

                </div>


                <div
                        id="resetError"
                        class="alert alert-danger py-2 d-none"
                        role="alert">
                </div>


                <button
                        type="submit"
                        id="resetBtn"
                        class="btn btn-accent w-100 btn-lg">

                    Đặt lại mật khẩu

                </button>

            </form>


            <div class="text-center mt-3">

                <button
                        type="button"
                        id="resendBtn"
                        class="btn btn-link"
                        disabled>

                    Gửi lại mã (60s)

                </button>

            </div>


            <div class="text-center">

                <button
                        type="button"
                        id="changeEmailBtn"
                        class="btn btn-link text-decoration-none">

                    Dùng email khác

                </button>

            </div>

        </div>


        <p class="text-center mt-4 mb-0">

            <a
                    th:href="@{/login}"
                    class="fw-semibold">

                Quay lại đăng nhập

            </a>

        </p>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>


<script th:inline="none">

    (function () {

        'use strict';

        var OB = window.OldBook;
        var Auth = OB.auth;


        /*
         * localStorage dùng để giữ email đang thực hiện
         * quy trình quên mật khẩu nếu người dùng refresh page.
         */

        var EMAIL_KEY = 'oldbook_forgot_email';
        var SENT_AT_KEY = 'oldbook_forgot_otp_sent_at';


        var requestStep =
            document.getElementById('requestStep');

        var resetStep =
            document.getElementById('resetStep');


        var requestForm =
            document.getElementById('forgotRequestForm');

        var resetForm =
            document.getElementById('resetPasswordForm');


        var emailInput =
            document.getElementById('forgotEmail');

        var resetEmailInput =
            document.getElementById('resetEmail');


        var otpInput =
            document.getElementById('forgotOtp');


        var newPasswordInput =
            document.getElementById('newPassword');

        var confirmPasswordInput =
            document.getElementById('confirmPassword');


        var requestBtn =
            document.getElementById('forgotRequestBtn');

        var resetBtn =
            document.getElementById('resetBtn');

        var resendBtn =
            document.getElementById('resendBtn');

        var changeEmailBtn =
            document.getElementById('changeEmailBtn');


        var requestError =
            document.getElementById('forgotRequestError');

        var resetError =
            document.getElementById('resetError');


        var countdownTimer = null;


        function storageGet(key) {

            try {
                return localStorage.getItem(key);
            } catch (e) {
                return null;
            }
        }


        function storageSet(key, value) {

            try {
                localStorage.setItem(key, value);
            } catch (e) {
            }

        }


        function storageRemove(key) {

            try {
                localStorage.removeItem(key);
            } catch (e) {
            }

        }


        function showError(element, message) {

            element.textContent = message;
            element.classList.remove('d-none');

        }


        function hideError(element) {

            element.textContent = '';
            element.classList.add('d-none');

        }


        function savePendingEmail(email) {

            storageSet(
                EMAIL_KEY,
                email
            );

        }


        function saveOtpSentTime() {

            storageSet(
                SENT_AT_KEY,
                String(Date.now())
            );

        }


        function clearPendingEmail() {

            storageRemove(EMAIL_KEY);
            storageRemove(SENT_AT_KEY);

        }


        function startCooldown() {

            if (countdownTimer) {

                clearInterval(countdownTimer);

            }


            var sentAt =
                Number(storageGet(SENT_AT_KEY) || 0);


            var endTime =
                sentAt + 60 * 1000;


            function update() {

                var seconds =
                    Math.ceil(
                        (endTime - Date.now()) / 1000
                    );


                if (seconds <= 0) {

                    resendBtn.disabled = false;
                    resendBtn.textContent =
                        'Gửi lại mã';

                    clearInterval(countdownTimer);

                    return;

                }


                resendBtn.disabled = true;

                resendBtn.textContent =
                    'Gửi lại mã (' + seconds + 's)';

            }


            update();


            countdownTimer =
                setInterval(
                    update,
                    1000
                );

        }


        function showResetStep(email) {

            requestStep.classList.add('d-none');
            resetStep.classList.remove('d-none');

            resetEmailInput.value = email;

            hideError(requestError);
            hideError(resetError);

            startCooldown();

        }


        function showRequestStep() {

            requestStep.classList.remove('d-none');
            resetStep.classList.add('d-none');

            hideError(requestError);
            hideError(resetError);

            if (countdownTimer) {

                clearInterval(countdownTimer);

                countdownTimer = null;

            }

            emailInput.focus();

        }


        /*
         * BƯỚC 1
         * Gửi email yêu cầu OTP
         */

        requestForm.addEventListener(
            'submit',
            function (event) {

                event.preventDefault();

                hideError(requestError);


                var email =
                    emailInput.value.trim();


                if (!email) {

                    showError(
                        requestError,
                        'Vui lòng nhập email.'
                    );

                    return;

                }


                requestBtn.disabled = true;
                requestBtn.textContent =
                    'Đang gửi...';


                Auth.forgotPassword(email)

                    .then(function () {

                        savePendingEmail(email);
                        saveOtpSentTime();

                        showResetStep(email);

                    })

                    .catch(function (err) {

                        showError(
                            requestError,
                            err.message
                        );

                    })

                    .finally(function () {

                        requestBtn.disabled = false;
                        requestBtn.textContent =
                            'Gửi mã OTP';

                    });

            }
        );


        /*
         * BƯỚC 2
         * Đặt lại mật khẩu
         */

        resetForm.addEventListener(
            'submit',
            function (event) {

                event.preventDefault();

                hideError(resetError);


                var email =
                    resetEmailInput.value.trim();

                var maOtp =
                    otpInput.value.trim();

                var matKhauMoi =
                    newPasswordInput.value;

                var xacNhanMatKhauMoi =
                    confirmPasswordInput.value;


                if (!email) {

                    showError(
                        resetError,
                        'Email không hợp lệ.'
                    );

                    return;

                }


                if (!/^\d{6}$/.test(maOtp)) {

                    showError(
                        resetError,
                        'Mã OTP phải gồm đúng 6 chữ số.'
                    );

                    return;

                }


                if (matKhauMoi.length < 8) {

                    showError(
                        resetError,
                        'Mật khẩu phải có ít nhất 8 ký tự.'
                    );

                    return;

                }


                if (!/[A-Za-z]/.test(matKhauMoi)
                    || !/\d/.test(matKhauMoi)) {

                    showError(
                        resetError,
                        'Mật khẩu phải gồm ít nhất chữ và số.'
                    );

                    return;

                }


                if (matKhauMoi !== xacNhanMatKhauMoi) {

                    showError(
                        resetError,
                        'Xác nhận mật khẩu không khớp.'
                    );

                    return;

                }


                resetBtn.disabled = true;
                resetBtn.textContent =
                    'Đang xử lý...';


                Auth.resetPassword(
                    email,
                    maOtp,
                    matKhauMoi,
                    xacNhanMatKhauMoi
                )

                    .then(function () {

                        /*
                         * Reset mật khẩu xong thì JWT cũ
                         * không nên tiếp tục được dùng.
                         */

                        Auth.clear();

                        clearPendingEmail();

                        OB.toast(
                            'Đặt lại mật khẩu thành công. Vui lòng đăng nhập lại.',
                            'success',
                            { duration: 1500 }
                        );


                        setTimeout(
                            function () {

                                window.location.replace(
                                    '/login'
                                );

                            },
                            1500
                        );

                    })

                    .catch(function (err) {

                        showError(
                            resetError,
                            err.message
                        );

                    })

                    .finally(function () {

                        resetBtn.disabled = false;
                        resetBtn.textContent =
                            'Đặt lại mật khẩu';

                    });

            }
        );


        /*
         * Gửi lại OTP
         */

        resendBtn.addEventListener(
            'click',
            function () {

                var email =
                    resetEmailInput.value.trim();


                hideError(resetError);


                resendBtn.disabled = true;
                resendBtn.textContent =
                    'Đang gửi...';


                Auth.resendForgotPasswordOtp(email)

                    .then(function () {

                        savePendingEmail(email);
                        saveOtpSentTime();

                        OB.toast(
                            'Đã gửi lại mã OTP.',
                            'success'
                        );

                        startCooldown();

                    })

                    .catch(function (err) {

                        showError(
                            resetError,
                            err.message
                        );

                        startCooldown();

                    });

            }
        );


        /*
         * Dùng email khác
         */

        changeEmailBtn.addEventListener(
            'click',
            function () {

                clearPendingEmail();

                emailInput.value = '';

                otpInput.value = '';
                newPasswordInput.value = '';
                confirmPasswordInput.value = '';

                showRequestStep();

            }
        );


        /*
         * Nếu refresh page:
         * khôi phục email đang quên mật khẩu.
         */

        var pendingEmail =
            storageGet(EMAIL_KEY);


        if (pendingEmail) {

            showResetStep(pendingEmail);

        } else {

            showRequestStep();

        }

    })();

</script>

</body>
</html>
