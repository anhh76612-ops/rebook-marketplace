<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sản phẩm yêu thích')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
      <li class="breadcrumb-item active">Sản phẩm yêu thích</li>
    </ol>
  </nav>
  <div class="section-title" style="margin-top:.5rem">
    <h2><i class="bi bi-heart-fill me-2" style="color:var(--accent)"></i>Sản phẩm yêu thích</h2>
  </div>
  <div class="row g-3" th:if="${!items.isEmpty()}">
    <div class="col-6 col-md-4 col-lg-3" th:each="b : ${items}">
      <div th:replace="~{fragments/layout :: card(${b})}"></div>
    </div>
  </div>
  <div class="panel text-center py-5" th:if="${items.isEmpty()}">
    <i class="bi bi-heart fs-1 text-muted"></i>
    <p class="mt-2">Bạn chưa có sản phẩm yêu thích nào.</p>
    <a th:href="@{/sach}" class="btn btn-accent">Khám phá sách</a>
  </div>

  <div class="section-title mt-4"><h2>Đã xem gần đây</h2></div>
  <div class="row g-3" th:if="${!viewed.isEmpty()}">
    <div class="col-6 col-md-4 col-lg-3" th:each="b : ${viewed}">
      <div th:replace="~{fragments/layout :: card(${b})}"></div>
    </div>
  </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
