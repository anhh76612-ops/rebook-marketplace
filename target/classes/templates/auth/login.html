<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - OldBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container">
    <div class="auth-card">
        <h1 class="h4 fw-bold text-center mb-1">Đăng nhập</h1>
        <p class="text-center text-muted mb-4">Đăng nhập để mua bán sách và theo dõi đơn hàng.</p>

        <!-- Form đăng nhập (Chưa gắn API) -->
        <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Nhập email">
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" placeholder="Nhập mật khẩu">
            </div>
            <div class="text-end mb-3">
                <a href="#">Quên mật khẩu?</a>
            </div>
            <button type="button" class="btn btn-accent w-100 btn-lg">Đăng Nhập</button>
        </form>

        <p class="text-center mt-4 mb-0">Chưa có tài khoản?
            <a th:href="@{/register}" class="fw-semibold">Đăng ký ngay</a>
        </p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
