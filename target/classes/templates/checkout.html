<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thanh toán')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
      <li class="breadcrumb-item"><a th:href="@{/gio-hang}">Giỏ hàng</a></li>
      <li class="breadcrumb-item active">Thanh toán</li>
    </ol>
  </nav>
  <h1 class="h4 fw-bold mb-3">Thanh toán</h1>

  <form th:action="@{/dat-hang-thanh-cong}" method="get">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="panel mb-3">
          <h2 class="h5 fw-bold mb-3">Thông tin người mua</h2>
          <div class="row g-3">
            <div class="col-sm-6"><label class="form-label">Họ và tên</label><input type="text" class="form-control" placeholder="Nguyễn Văn A"></div>
            <div class="col-sm-6"><label class="form-label">Số điện thoại</label><input type="tel" class="form-control" placeholder="09xx xxx xxx"></div>
            <div class="col-12"><label class="form-label">Email nhận sách</label><input type="email" class="form-control" placeholder="nhap@email.com"></div>
            <div class="col-12"><label class="form-label">Ghi chú</label><textarea class="form-control" rows="2"></textarea></div>
          </div>
        </div>
        <div class="panel mb-3">
          <h2 class="h5 fw-bold mb-3">Đơn vị vận chuyển</h2>
          <div class="form-check mb-2"><input class="form-check-input" type="radio" name="ship" id="sv1" checked><label class="form-check-label" for="sv1">Giao hàng nhanh (GHN) — 20.000 đ</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="ship" id="sv2"><label class="form-check-label" for="sv2">Giao hàng tiết kiệm (GHTK) — 15.000 đ</label></div>
        </div>
        <div class="panel">
          <h2 class="h5 fw-bold mb-3">Phương thức thanh toán</h2>
          <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pay" id="p1" checked><label class="form-check-label" for="p1"><i class="bi bi-cash-coin me-1"></i>Thanh toán khi nhận hàng (COD)</label></div>
          <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pay" id="p2"><label class="form-check-label" for="p2"><i class="bi bi-wallet2 me-1"></i>Ví MoMo</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="pay" id="p3"><label class="form-check-label" for="p3"><i class="bi bi-credit-card me-1"></i>VNPAY</label></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="panel">
          <h2 class="h5 fw-bold mb-3">Đơn hàng của bạn</h2>
          <div class="d-flex align-items-center gap-3 mb-3" th:each="b : ${items}">
            <div class="mini-cover" th:classappend="'c' + ${b.id % 6}"></div>
            <div class="flex-grow-1">
              <div class="fw-semibold" th:text="${b.title}">Tên sách</div>
              <div class="small text-muted">Số lượng: 1</div>
            </div>
            <span th:text="${#numbers.formatInteger(b.ebookPrice, 1, 'COMMA')} + ' đ'">0 đ</span>
          </div>
          <hr>
          <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Mã giảm giá / Voucher">
            <button type="button" class="btn btn-outline-navy">Áp dụng</button>
          </div>
          <div class="d-flex justify-content-between mb-2"><span>Tạm tính</span><span th:text="${#numbers.formatInteger(total, 1, 'COMMA')} + ' đ'">0 đ</span></div>
          <div class="d-flex justify-content-between mb-2"><span>Giảm giá</span><span>0 đ</span></div>
          <div class="d-flex justify-content-between mb-2"><span>Phí vận chuyển</span><span>20.000 đ</span></div>
          <hr>
          <div class="d-flex justify-content-between fs-5 fw-bold mb-3"><span>Tổng cộng</span><span class="price" th:text="${#numbers.formatInteger(total, 1, 'COMMA')} + ' đ'">0 đ</span></div>
          <button type="submit" class="btn btn-accent btn-lg w-100">Đặt hàng</button>
          <a th:href="@{/gio-hang}" class="btn btn-outline-navy w-100 mt-2">Quay lại giỏ hàng</a>
        </div>
      </div>
    </div>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
